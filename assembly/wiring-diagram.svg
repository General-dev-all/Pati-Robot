<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1720 1300" width="1720" height="1300"
     role="img" aria-label="Pati wiring diagram. An ESP32-S3 board drawn horizontally with USB on the right. Microphone, amplifier and display sit below it, each aligned under the pins it connects to, so most wires run straight up. A Type-C socket on the right feeds 5 V through a junction to both the board and the amplifier.">
<title>Pati — wiring diagram</title>
<desc>Every wire is labelled at both ends: the pad name on the module and the same
name on a cable tag beside the board pin. Pin numbers come from
firmware/main/pati_pinler.h; header order from assembly/REHBER.html.</desc>

<!--
  ===========================================================================
  STANDALONE SVG — rendered as an image in README.md
  ===========================================================================
  GitHub serves this through an <img>, so it must be self-contained: styles
  live in the <style> block below, colours are literals, no external refs and
  no script. A CSS custom property inherited from a page would resolve to
  nothing here.

  The sheet paints its own light background on purpose. prefers-color-scheme
  inside an SVG-as-image follows the reader's SYSTEM theme, not the GitHub
  theme they picked, so a "theme-aware" sheet would be light-on-dark for
  anyone whose two settings disagree. A drawing sheet reads correctly on both
  GitHub themes; a half-applied one does not.

  Turkish bench version, kept in step with this file: assembly/SEMA.html
  ===========================================================================
-->
<style>
  .paper  { fill:#F4F6F3 }
  .pcb    { fill:#222A2E; stroke:#3A444B; stroke-width:2 }
  .silk   { fill:#DCE2DE; font-family:"Courier New",monospace }
  .muted  { fill:#596266; font-family:"Courier New",monospace; font-size:11px }
  .ink    { fill:#12171A; font-family:"Courier New",monospace }
  .wire   { fill:none; stroke-width:3; stroke-linecap:round; stroke-linejoin:round }
  .w3v3   { stroke:#0D6A69 } .w5v  { stroke:#BD3125 } .wgnd { stroke:#485256 }
  .wmic   { stroke:#6A4EA7 } .wamp { stroke:#226E48 } .wdsp { stroke:#96570F }
  .p3v3   { fill:#0D6A69 }  .p5v  { fill:#BD3125 }  .pgnd { fill:#485256 }
  .pmic   { fill:#6A4EA7 }  .pamp { fill:#226E48 }  .pdsp { fill:#96570F }
  .tag    { fill:#F4F6F3; stroke-width:1.5; rx:3 }
  .tagtx  { font-family:"Courier New",monospace; font-size:11.5px; font-weight:bold;
            text-anchor:middle }
  .pad    { font-family:"Courier New",monospace; font-size:12.5px; font-weight:bold }
  .mod    { fill:#E8EBE6; stroke:#12171A; stroke-width:2 }
  .modname{ font-family:"Courier New",monospace; font-size:14px; letter-spacing:1.4px;
            fill:#12171A }
</style>

