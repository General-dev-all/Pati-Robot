<text class="muted" x="1372" y="788" font-size="11.5">Strip the socket's (+) lead. Add two</text>
<text class="muted" x="1372" y="806" font-size="11.5">wires: one to the board's 5Vin, one to</text>
<text class="muted" x="1372" y="824" font-size="11.5">the amp's VIN. Twist all three, solder,</text>
<text class="muted" x="1372" y="842" font-size="11.5">cover with heat-shrink.</text>
<path class="wire" d="M1344 726 L1358 760" stroke="#BD3125" stroke-width="1.5" opacity=".5"/>

