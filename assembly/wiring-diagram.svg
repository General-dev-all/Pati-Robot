<text class="ink" x="235" y="118" font-size="20" letter-spacing="3.5" font-weight="bold">PATI — WIRING</text>
<text class="muted" x="235" y="140" font-size="12">Each module sits under the pins it connects to, so most wires run straight up.</text>
<text class="muted" x="235" y="156" font-size="12">Every wire is named at both ends: on the module pad and on the cable tag by the board pin.</text>
<text class="muted" x="235" y="172" font-size="12">Identify a pad by its printed name, not by counting positions — the pad order differs per module.</text>
</svg>
