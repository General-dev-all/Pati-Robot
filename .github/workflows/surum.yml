# Pati — surum yayimlama
#
# ===========================================================================
# NE ISE YARIYOR
# ===========================================================================
#
# `firmware/surum.txt` degisip push edilince: GitHub firmware'i kendi
# sunucusunda derliyor, bir Release aciyor ve icine iki dosya koyuyor —
# `pati.bin` ile `surum.json`.
#
# Yani Mert'in yapmasi gereken tek sey PUSH. Release acmak, dosya
# yuklemek, adres yazmak yok.
#
# ===========================================================================
# NEDEN surum.json DEPOYA DEGIL, RELEASE'IN ICINE
# ===========================================================================
#
# Once depodaydi ve sessiz bir kusuru vardi: push, manifesti ANINDA
# yayina sokuyor ama pati.bin'i olusturmuyor. Derleme bitene kadar
# gecen dakikalarda panel "guncelleme var" der, anne basar, indirme
# 404'e duserdi.
#
# Ikisi ayni Release'in icinde olunca manifest, tarif ettigi dosyadan
# ONCE VAR OLAMIYOR. Bosluk mumkun degil — dikkatle degil, yapisi geregi.
#
# Cihaz `releases/latest/download/surum.json` adresine bakiyor; o kisayol
# her zaman en son Release'i gosteriyor.
#
# ===========================================================================
# DERLEME NEDEN GIZLI BILGI ISTEMIYOR
# ===========================================================================
#
# Cunku firmware'de gizli bilgi KALMADI. Gemini anahtari panelden
# giriliyor ve cihazin NVS'inde duruyor; wifi bilgisi de oyle. Kaynak
# dosyalarin hicbiri `CONFIG_PATI_WIFI_*` okumuyor.
#
# Bu, anahtari Kconfig'den cikarmanin beklenmedik faydasi: GitHub'in
# sunucusu hicbir sirri gormeden derleyebiliyor ve cikan `pati.bin`
# herkese acik durabiliyor.

name: surum

on:
  push:
    branches: [main]
    # ROBOTA GIREN HER SEY. Mert'in Sync'e basmasi "bu hal yayina
    # gitsin" demek — yedekleme icin push etmiyor. O yuzden surum
    # numarasini beklemiyoruz, asagida kendimiz uretiyoruz.
    #
    # panel/ de burada cunku sayfa firmware'e GOMULUYOR (EMBED_FILES):
    # paneldeki bir yazi degisikligi de yeni bir ikili dosya demek.
    #
    # Belge degisiklikleri (README, PLAN) LISTEDE YOK: ikili dosyaya
    # girmiyorlar, yani yayimlamak anneye ayni firmware'i yeniden
    # indirtmekten baska bir sey yapmazdi.
    #
    # ⚠️ `paths` ile `paths-ignore` AYNI OLAYDA KULLANILAMAZ (GitHub
    # reddediyor). CI'nin kendi geri yazdigi surum.txt commit'i bu
    # yuzden dosya yoluyla degil, commit mesajindaki [skip ci] ile
    # disarida birakiliyor — yoksa her yayim bir sonrakini tetikler ve
    # dongu elle durdurulana kadar surer.
    paths:
      - 'firmware/**'
      - 'panel/**'
  # Elle de calistirilabilsin: derleme bir kez basarisiz olursa
  # hicbir dosyaya dokunmadan tekrar denenebilmeli.
  workflow_dispatch:

permissions:
  contents: write        # Release acmak icin

jobs:
  yayimla:
    runs-on: ubuntu-latest

    steps:
      # fetch-depth: 0 — sonda surum.txt geri yaziliyor ve sig bir
      # kopyada `git pull --rebase` calismiyor.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Surumu belirle ve notu oku
        id: s
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          DOSYA=$(head -n 1 firmware/surum.txt | tr -d '[:space:]')
          # Gerisi annenin panelde okuyacagi not. Bos satirlar atiliyor,
          # satirlar tek cumleye birlestiriliyor: panel bunu tek satirlik
          # bir kutuda gosteriyor.
          NOT=$(tail -n +2 firmware/surum.txt | sed '/^[[:space:]]*$/d' \
                | paste -sd' ' - | cut -c1-300)

          if ! [[ "$DOSYA" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::surum.txt'nin ilk satiri '2.2.0' gibi olmali, '$DOSYA' bulundu"
            exit 1
          fi
          # Not bos kalirsa panelde bos bir kutu gorunurdu. Sessizce bos
          # birakmak yerine soyluyoruz: bu, anneye gosterilecek tek metin.
          if [ -z "$NOT" ]; then
            echo "::error::surum.txt'de not yok. Ilk satirin ALTINA annenin okuyacagi bir cumle yaz."
            exit 1
          fi

          # ---- SURUM NUMARASINI CI VERIYOR ------------------------------
          #
          # Mert'in Sync'e basmasi "bu hal yayina gitsin" demek; ayrica
          # bir de numara yukseltmesi gerekmemeli. Unutulursa hicbir
          # uyari cikmiyordu: yirmi commit push edilir, Release acilmaz,
          # anne eski Pati'yle kalir ve kimse fark etmez.
          #
          # KURAL:
          #   dosyadaki > en son yayimlanan  ->  dosyadakini kullan
          #                                     (elle yukseltilmis, anlamli
          #                                      bir surum: 2.2.x -> 2.3.0)
          #   degilse                        ->  yamayi bir artir
          #
          # Yani numara elle de yukseltilebiliyor ama ZORUNLU degil.
          SON=$(gh release list --limit 1 --json tagName \
                --jq '.[0].tagName // ""' | sed 's/^v//')

          if [ -z "$SON" ]; then
            YENI="$DOSYA"                       # ilk yayim
          elif [ "$DOSYA" != "$SON" ] && \
               [ "$(printf '%s\n%s\n' "$SON" "$DOSYA" | sort -V | tail -1)" = "$DOSYA" ]; then
            YENI="$DOSYA"                       # elle yukseltilmis
          else
            YENI=$(echo "$SON" | awk -F. '{printf "%d.%d.%d", $1, $2, $3+1}')
          fi

          echo "son yayimlanan : ${SON:-yok}"
          echo "dosyada        : $DOSYA"
          echo "yayimlanacak   : $YENI"

          # Derleme bunu okuyacak: PROJECT_VER surum.txt'den geliyor.
          printf '%s\n%s\n' "$YENI" "$NOT" > firmware/surum.txt

          echo "surum=$YENI"   >> "$GITHUB_OUTPUT"
          echo "etiket=v$YENI" >> "$GITHUB_OUTPUT"
          echo "not=$NOT"      >> "$GITHUB_OUTPUT"

      - name: Derle
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: release-v5.5
          target: esp32s3
          path: firmware

      - name: Imajdaki surum dosyadakiyle ayni mi
        run: |
          set -euo pipefail
          # 🔴 BU DENETIM BIR HATA YAKALADI, SUSLEME DEGIL.
          #
          # 01.08.2026: surum.txt 2.1.1 diyordu, derlenen pati.bin 2.1.0.
          # Sebep CMake'in dosyayi bagimlilik saymamasiydi (duzeltildi).
          # Yayimlansaydi cihaz indirir, "beklenen surum degil" diye
          # reddederdi ve surum.txt'ye bakan biri sebebi goremezdi.
          #
          # Surum, uygulama imzasinda 48. bayttan basliyor (esp_app_desc).
          IMAJ=$(python3 -c "
          d=open('firmware/build/pati.bin','rb').read()
          print(d[48:80].split(b'\x00')[0].decode())")
          echo "dosyada: ${{ steps.s.outputs.surum }} · imajda: $IMAJ"
          if [ "$IMAJ" != "${{ steps.s.outputs.surum }}" ]; then
            echo "::error::Imajdaki surum ($IMAJ) surum.txt ile ayni degil."
            exit 1
          fi

      - name: surum.json uret
        run: |
          set -euo pipefail
          # jq ile uretiliyor, elle dize birlestirerek DEGIL: notta tirnak
          # ya da ters bolu gecerse elle kurulan JSON bozulur ve cihaz
          # manifesti hic okuyamaz — yani guncelleme sessizce kaybolur.
          jq -n \
            --arg surum  "${{ steps.s.outputs.surum }}" \
            --arg tarih  "$(date -u +%Y-%m-%d)" \
            --arg notlar "${{ steps.s.outputs.not }}" \
            --arg bin    "${{ github.server_url }}/${{ github.repository }}/releases/download/${{ steps.s.outputs.etiket }}/pati.bin" \
            '{surum:$surum, tarih:$tarih, notlar:$notlar, bin:$bin}' \
            > surum.json
          cat surum.json

      - name: Release ac
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Ikisi TEK adimda yukleniyor. Ayri adimlar olsaydi arada
          # manifest'i olan ama binary'si olmayan bir Release olusurdu —
          # kacinmaya calistigimiz seyin ta kendisi.
          gh release create "${{ steps.s.outputs.etiket }}" \
            firmware/build/pati.bin \
            surum.json \
            --title "${{ steps.s.outputs.etiket }}" \
            --notes "${{ steps.s.outputs.not }}" \
            --latest

      - name: surum.txt'yi geri yaz
        run: |
          set -euo pipefail
          # Dosya HER ZAMAN yayindaki surumu gostersin.
          #
          # Geri yazmasak numara yalnizca Release etiketlerinde yasardi
          # ve surum.txt eskimis bir sayi tutardi — depoya bakan biri
          # yanlis bilgi okur. Bu depo eskimis belgeyi belgesizlikten
          # kotu sayiyor; ayni sey dosyalar icin de gecerli.
          #
          # [skip ci] SART: bu commit surum.txt'ye dokunuyor, yani is
          # akisinin tetikleyicisine giriyor. Onsuz her yayim bir
          # sonrakini baslatir ve dongu elle durdurulana kadar surer.
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add firmware/surum.txt
          if git diff --cached --quiet; then
            echo "surum.txt zaten guncel"
            exit 0
          fi
          git commit -m "Publish ${{ steps.s.outputs.surum }} [skip ci]"
          # Bu is kosarken Mert bir daha push etmis olabilir. Rebase ile
          # ustune biniyoruz; yine de olmazsa YAYIMI BOZMUYORUZ —
          # Release zaten acildi ve anne guncelleyebiliyor. Sadece dosya
          # bir tur geride kalir ve bir sonraki yayimda duzelir.
          git pull --rebase --autostash origin main || true
          git push || echo "::warning::surum.txt geri yazilamadi; Release yayimlandi, dosya bir sonraki yayimda duzelir"

      - name: Ozet
        run: |
          {
            echo "### Pati ${{ steps.s.outputs.surum }} yayimlandi"
            echo ""
            echo "${{ steps.s.outputs.not }}"
            echo ""
            echo "Anne artik panelden **Güncellemeleri kontrol et** diyebilir."
          } >> "$GITHUB_STEP_SUMMARY"
